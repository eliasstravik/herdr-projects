[package]
name = "herdr-projects"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Projects for herdr: a coordinator conversation, parallel worker threads, shared memory and an overview"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
