[package]
name = "herdr-projects"
version.workspace = true
edition.workspace = true
description = "A work board for herdr: one list of tasks, each delegated one running as an ordinary herdr agent."
license.workspace = true
publish = false
# The tests are one program (tests/main.rs, every file in tests/ a module of it), not one program per file.
autotests = false

[lib]
name = "sw"
path = "src/lib.rs"

[[bin]]
name = "herdr-projects"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

# The program is several crates, one on top of the other, so that a change builds again only its own crate and the
# ones on top of it: sw-core (the data and herdr), sw-flow (the flow of a task), sw-board (the board's screen), sw-web
# (the board in the herdr web UI), each in crates/, and this one (the command line and the made pages, src/), which
# the tests use as `sw`. Why and how: docs/crates.md.
[workspace]
members = ["crates/core", "crates/flow", "crates/board", "crates/web"]
# `cargo build` and `cargo test` take them all, as they took the one crate before: the tests beside the code too.
default-members = [".", "crates/core", "crates/flow", "crates/board", "crates/web"]

[workspace.package]
version = "1.2.27"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
sw-core = { path = "crates/core" }
sw-flow = { path = "crates/flow" }
sw-board = { path = "crates/board" }
sw-web = { path = "crates/web" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number read back from a saved file is the number written (a closing note's time is compared exactly).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unicode-width = "0.2"
unicode-segmentation = "1"
libc = "0.2"
regex = "1"
fancy-regex = "0.14"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha1_smol = "1"
# GitHub's workflow files, read as GitHub reads them, to know which checks a pull request is to get (land/triggers.rs).
yaml-rust2 = { version = "0.10", default-features = false }
# A voice call from the terminal board: ElevenLabs' conversation over a WebSocket, with TLS in Rust only (ring), so
# the musl release builds need no system library (crates/flow/src/calls/native/).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dependencies]
sw-web.workspace = true
regex.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
chrono.workspace = true
crossterm.workspace = true
fancy-regex.workspace = true
libc.workspace = true
ratatui.workspace = true

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# What the check builds and tests with (scripts/check.sh): quick to build again after a small change. The program's
# own code is not optimised (an optimised build of it took 15 to 30 seconds after an edit, this one 3 to 8, and the
# tests run a few seconds longer); the libraries it uses are, once, from the build cache every worktree shares. The
# release build above is for the files people install.
[profile.quick]
inherits = "dev"
opt-level = 0
debug = false

[profile.quick.package."*"]
opt-level = 1
