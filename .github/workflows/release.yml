# Builds the program for every platform and attaches it to the GitHub release of a version tag.
#
# Runs when a tag `v*` is pushed (`git tag v1.2.27 && git push origin v1.2.27`), or by hand with a tag to build the files
# of an existing release again; by hand with `dry_run` it builds and checks every file but attaches nothing, to test the
# workflow itself. Each file is `herdr-projects-<os>-<arch>` (os linux|macos, arch x86_64|aarch64) with its `.sha256`
# beside it: bin/run.sh and `herdr-projects update` download exactly these names. The Linux files are static (musl), so
# they run on any Linux. The tag must be the version in Cargo.toml and herdr-plugin.toml, or the run fails: run.sh asks
# for the release named by Cargo.toml's version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, e.g. v1.2.27
        required: true
      dry_run:
        description: Build and check every file, but attach nothing to the release
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, file: herdr-projects-linux-x86_64, runs: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04, file: herdr-projects-linux-aarch64, zig: true }
          - { target: x86_64-apple-darwin, runner: macos-14, file: herdr-projects-macos-x86_64 }
          - { target: aarch64-apple-darwin, runner: macos-14, file: herdr-projects-macos-aarch64, runs: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check the tag is the version in Cargo.toml and herdr-plugin.toml
        run: |
          version="${TAG#v}"
          grep -qx "version = \"$version\"" Cargo.toml || { echo "::error::Cargo.toml's version is not $version"; exit 1; }
          grep -qx "version = \"$version\"" herdr-plugin.toml || { echo "::error::herdr-plugin.toml's version is not $version"; exit 1; }

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install musl tools
        if: contains(matrix.target, 'linux') && !matrix.zig
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install zig and cargo-zigbuild (to build for ARM Linux here)
        if: matrix.zig
        run: |
          python3 -m pip install --user --break-system-packages ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = true ]; then cargo zigbuild --release --locked --target ${{ matrix.target }}
          else cargo build --release --locked --target ${{ matrix.target }}; fi

      - name: Name the file and write its checksum
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/herdr-projects dist/${{ matrix.file }}
          cd dist && shasum -a 256 ${{ matrix.file }} > ${{ matrix.file }}.sha256 && cat ${{ matrix.file }}.sha256

      - name: Check it runs and says the release's version
        if: matrix.runs
        env:
          HERDR_PROJECTS_INLINE: "1"
          HERDR_PROJECTS_HOME: ${{ runner.temp }}/sw
        run: |
          out=$(dist/${{ matrix.file }} version)
          echo "$out"
          case "$out" in "herdr-projects ${TAG#v} "*) ;; *) echo "::error::expected herdr-projects ${TAG#v}"; exit 1 ;; esac

      - name: Check the Linux file is static
        if: contains(matrix.target, 'linux')
        run: file dist/${{ matrix.file }} | tee /dev/stderr | grep -q "statically linked\|static-pie linked"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check every file is there
        working-directory: dist
        run: |
          for os in linux macos; do for arch in x86_64 aarch64; do
            f="herdr-projects-$os-$arch"
            [ -s "$f" ] && [ -s "$f.sha256" ] || { echo "::error::$f or its checksum is missing"; exit 1; }
            sha256sum -c "$f.sha256"
          done; done

      - name: Attach them to the release (made when it is not there yet)
        if: ${{ !inputs.dry_run }}
        working-directory: dist
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" herdr-projects-* --clobber
