# End-to-end smoke test on Windows: a headless herdr server, the plugin linked
# from this checkout, a stub `claude.exe`, and the paths a user goes through:
# project, coordinator, thread and brief, ticker, links, hooks, routines and
# doctor. Unit tests stay in ci.yml; this checks that the pieces work together
# under a real herdr on Windows.
#
# The stub and the helpers live in .github/windows-smoke/. Each check is its
# own step with a short timeout, and the first failing check stops the job:
# later checks build on earlier ones (no thread without a coordinator). Only
# collecting logs, uploading them and stopping the server always run. The job
# summary lists the checks that ran. Run it by hand with "Run workflow", and
# tick "tmate" to get a shell on the runner (only you can connect) before the
# server is stopped.
name: Windows smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tmate:
        description: "Open a tmate session (only you can connect) before the server is stopped"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  smoke:
    name: smoke (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 25
    # Not required while it stabilises: a failure shows on the pull request
    # but does not block it.
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    env:
      HERDR_SESSION: ci-smoke
      # herdr-projects counts a claude profile as signed in only when this is
      # set; the stub never uses it.
      CLAUDE_CODE_OAUTH_TOKEN: dummy-smoke-test-token
      HERDR_LOG: herdr=debug
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: smoke-${{ runner.os }}-${{ runner.arch }}-

      - name: Build herdr-projects
        run: cargo build --release --locked

      - name: Set up folders and environment
        run: |
          . .github/windows-smoke/helpers.ps1
          $t = $env:RUNNER_TEMP
          $dirs = @{
            HERDR_PROJECTS_ROOT = "$t\hp-root"
            STUB_LOG_DIR        = "$t\stub-logs"
            SMOKE_ARTIFACTS     = "$t\smoke-artifacts"
            HERDR_INSTALL_DIR   = "$t\herdr-bin"
            STUB_DIR            = "$t\stub"
          }
          foreach ($name in $dirs.Keys) {
            New-Item -ItemType Directory -Force $dirs[$name] | Out-Null
            "$name=$($dirs[$name])" | Add-Content $env:GITHUB_ENV
          }
          "HP_EXE=$env:GITHUB_WORKSPACE\target\release\herdr-projects.exe" | Add-Content $env:GITHUB_ENV
          # Searched first to last: the stub must win over any real claude.
          $dirs.STUB_DIR | Add-Content $env:GITHUB_PATH
          $dirs.HERDR_INSTALL_DIR | Add-Content $env:GITHUB_PATH
          # Where the plugin writes its herdr-projects.cmd shim.
          "$env:USERPROFILE\.local\bin" | Add-Content $env:GITHUB_PATH
          # herdr's panes take PATH from the registry (machine and user), not
          # from the server's environment (run 36843818657 showed a pane
          # without the folders above). Installers put claude, herdr and
          # the shim folder on the user PATH, so do the same here.
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $front = @($dirs.STUB_DIR, $dirs.HERDR_INSTALL_DIR, "$env:USERPROFILE\.local\bin") -join ";"
          [Environment]::SetEnvironmentVariable("Path", "$front;$userPath", "User")
          "| Check | Result | Detail |" | Add-Content $env:GITHUB_STEP_SUMMARY
          "| --- | --- | --- |" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Install herdr
        run: |
          . .github/windows-smoke/helpers.ps1
          irm https://herdr.dev/install.ps1 | iex
          $global:LASTEXITCODE = 0
          Invoke-Checked "$env:HERDR_INSTALL_DIR\herdr.exe" @("--version")

      - name: Build the stub claude.exe
        run: |
          . .github/windows-smoke/helpers.ps1
          Invoke-Checked rustc @("--edition", "2021", "-O", ".github\windows-smoke\claude_stub.rs", "-o", "$env:STUB_DIR\claude.exe")
          Invoke-Checked "$env:STUB_DIR\claude.exe" @("--version")
          $found = (Get-Command claude).Source
          if ($found -ne "$env:STUB_DIR\claude.exe") { throw "claude resolves to $found, not the stub" }

      - name: Link the plugin
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          # "windows" stays out of the manifest's top-level `platforms` until
          # this smoke test passes reliably (decided 2026-10-01). Until then
          # herdr skips the plugin's actions, panes and startup hook on
          # Windows, so this job adds it in its own checkout only. Remove this
          # patch once the manifest lists "windows".
          $lines = [System.IO.File]::ReadAllLines("$PWD\herdr-plugin.toml")
          $patched = $false
          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ($lines[$i].StartsWith("[[")) { break }  # top level only, not [[build]] entries
            if ($lines[$i] -match '^platforms\s*=\s*\[(.*)\]\s*$') {
              if ($Matches[1] -notmatch '"windows"') { $lines[$i] = "platforms = [$($Matches[1]), `"windows`"]" }
              $patched = $true
              break
            }
          }
          if (-not $patched) { throw "no top-level platforms in herdr-plugin.toml" }
          [System.IO.File]::WriteAllLines("$PWD\herdr-plugin.toml", $lines)
          Select-String -Path herdr-plugin.toml -Pattern '^platforms' | Select-Object -First 1 | ForEach-Object { Write-Host $_.Line }
          # `plugin link`, not `plugin install`: install hits herdr#4179 on
          # Windows. Linking before the server starts lets herdr run the
          # plugin's startup hook at server start, as for a user.
          Invoke-Checked herdr @("plugin", "link", $env:GITHUB_WORKSPACE)
          $list = Invoke-Checked herdr @("plugin", "list", "--json")
          if ($list -notmatch 'herdr-projects') { throw "plugin list does not show herdr-projects" }

      - name: Create the project
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          # Before the server starts, so the startup hook finds a project and
          # starts the ticker.
          Invoke-Check "project created" {
            Hp new smoke --goal "Windows smoke test" | Out-Null
            $dir = Join-Path $env:HERDR_PROJECTS_ROOT "smoke"
            foreach ($file in @("PROJECT.md", "AGENTS.md", "CLAUDE.md")) {
              if (-not (Test-Path (Join-Path $dir $file))) { throw "$file missing in $dir" }
            }
            "in $dir"
          }

      - name: Start the herdr server
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          # herdr's own Windows CI pattern (scripts/windows_smoke_conpty_path.ps1).
          $server = Start-Process -FilePath "$env:HERDR_INSTALL_DIR\herdr.exe" -ArgumentList "server" -PassThru -WindowStyle Hidden
          "HERDR_SERVER_PID=$($server.Id)" | Add-Content $env:GITHUB_ENV
          Wait-Until "herdr server running" 30 {
            $status = Invoke-Quiet herdr @("status", "server")
            $status.Code -eq 0 -and $status.Text -match "status: running"
          } -IntervalMs 250 | Out-Null
          Invoke-Checked herdr @("status", "server") | Out-Null

      - name: "Check: a pane finds the stub"
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          # Agents start in pane shells, which get herdr's environment: the
          # stub must resolve there, not only in this step.
          Invoke-Check "pane resolves claude to the stub" {
            $created = (Invoke-Checked herdr @("workspace", "create", "--cwd", $env:RUNNER_TEMP, "--label", "terminal")) | ConvertFrom-Json
            $term = $created.result.root_pane.pane_id
            "TERMINAL_PANE=$term" | Add-Content $env:GITHUB_ENV
            Wait-Until "a shell prompt in $term" 30 { (Read-Pane $term) -match "PS |>" } | Out-Null
            Send-PaneLine $term 'Write-Output "PATH=$env:PATH"; Write-Output "CLAUDE=$((Get-Command claude -ErrorAction SilentlyContinue).Source)"; Write-Output "LOGDIR=$env:STUB_LOG_DIR"'
            $screen = Wait-Until "the pane printed CLAUDE=" 30 { $t = Read-Pane $term; if ($t -match "(?m)^CLAUDE=") { $t } }
            Write-Host $screen
            $claude = [regex]::Match($screen, "(?m)^CLAUDE=(.*)$").Groups[1].Value.Trim()
            if ($claude -ne "$env:STUB_DIR\claude.exe") { throw "claude in a pane resolves to '$claude'" }
            $claude
          }

      - name: "Check: startup hook starts the ticker"
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          Invoke-Check "startup hook starts the ticker" {
            $status = Wait-Until "ticker running" 45 {
              $s = Invoke-Quiet $env:HP_EXE @("ticker", "status")
              if ($s.Text -match "ticker: running") { $s.Text }
            }
            Write-Host $status
            if ($status -notmatch "pid:\s+(\d+)") { throw "no pid in ticker status" }
            "TICKER_PID=$($Matches[1])" | Add-Content $env:GITHUB_ENV
            "pid $($Matches[1])"
          }
          # herdr records the startup command as finished only once its output
          # pipes close: a ticker that inherited them kept it `running`.
          Invoke-Check "startup hook finishes" {
            $entry = Wait-Until "the startup command no longer running" 30 {
              $logs = ((Invoke-Quiet herdr @("plugin", "logs", "--plugin", "herdr-projects")).Text | ConvertFrom-Json).result.logs
              $logs | Where-Object { $_.event -eq "startup" -and $_.status -ne "running" } | Select-Object -First 1
            }
            if ($entry.status -ne "succeeded") { throw "startup command $($entry.status): $($entry | ConvertTo-Json -Compress)" }
            $entry.status
          }

      - name: "Check: ticker survives after the startup hook exits"
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          # The startup hook is a short-lived child of herdr; the ticker it
          # starts is detached (DETACHED_PROCESS). On Windows herdr may run
          # plugin commands in a Job object that kills what is left when the
          # command ends: this is the open question from t-0003.
          Invoke-Check "ticker survives its starting command" {
            if (-not $env:TICKER_PID) { throw "no ticker pid recorded" }
            Start-Sleep -Seconds 20
            $logs = Invoke-Quiet herdr @("plugin", "logs", "--plugin", "herdr-projects")
            Write-Host $logs.Text
            if (-not (Get-Process -Id $env:TICKER_PID -ErrorAction SilentlyContinue)) { throw "ticker process $env:TICKER_PID is gone" }
            $s = Invoke-Quiet $env:HP_EXE @("ticker", "status")
            if ($s.Text -notmatch "pid:\s+$env:TICKER_PID\b") { throw "ticker status changed: $($s.Text)" }
            "pid $env:TICKER_PID alive after 20 s"
          }

      - name: Configure hooks and skill
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          Invoke-Check "configure" {
            Hp configure --clients claude | Out-Null
            $settings = Get-Content -Raw "$env:USERPROFILE\.claude\settings.json"
            Write-Host $settings
            if ($settings -notmatch 'hook --agent claude') { throw "no hook in .claude/settings.json" }
            "hooks in .claude/settings.json"
          }

      - name: "Check: open the coordinator"
        timeout-minutes: 3
        run: |
          . .github/windows-smoke/helpers.ps1
          Invoke-Check "coordinator opens" {
            Hp open smoke | Out-Null
            $record = Get-Content -Raw "$env:HERDR_PROJECTS_ROOT\smoke\.state\coordinator.json" | ConvertFrom-Json
            if (-not $record.pane_id) { throw "coordinator.json has no pane" }
            "COORDINATOR_PANE=$($record.pane_id)" | Add-Content $env:GITHUB_ENV
            $agent = Wait-Until "coordinator agent idle" 60 {
              $list = (Invoke-Quiet herdr @("agent", "list")).Text | ConvertFrom-Json
              $list.result.agents | Where-Object { $_.pane_id -eq $record.pane_id -and $_.agent_status -eq "idle" }
            }
            Write-Host ($agent | ConvertTo-Json -Depth 5)
            "pane $($record.pane_id), agent $($agent.name)"
          }

      - name: "Check: thread start and brief"
        timeout-minutes: 4
        run: |
          . .github/windows-smoke/helpers.ps1
          Invoke-Check "thread starts" {
            "Smoke task: reply with OK." | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\task.md"
            Hp thread start smoke --title "Smoke thread" --task-file "$env:RUNNER_TEMP\task.md" --kind tab | Out-Null
            $record = Wait-Until "thread t-0001 placed with a pane" 30 {
              $r = Get-ThreadRecord smoke t-0001
              if ($r -and $r.pane_id -and $r.status -eq "open") { $r }
            }
            "THREAD_PANE=$($record.pane_id)" | Add-Content $env:GITHUB_ENV
            $agent = Wait-Until "thread agent running" 60 {
              $list = (Invoke-Quiet herdr @("agent", "list")).Text | ConvertFrom-Json
              $list.result.agents | Where-Object { $_.pane_id -eq $record.pane_id -and $_.agent -eq "claude" }
            }
            "pane $($record.pane_id), agent $($agent.name)"
          }
          # herdr#4529: on Windows the first prompt to a new agent is often
          # typed but not submitted. The stub logs every line it receives.
          Invoke-Check "brief arrives" {
            $pane = (Get-ThreadRecord smoke t-0001).pane_id
            Wait-Until "the stub received the brief line" 60 {
              (Get-StubLog $pane) -match "prompt: Read \.herdr-project/smoke-t-0001/brief\.md"
            } -IntervalMs 2000 | Out-Null
            $record = Wait-Until "the record says delivered" 30 {
              $r = Get-ThreadRecord smoke t-0001
              if ($r -and -not $r.prompt_pending) { $r }
            }
            $brief = Join-Path $record.thread_dir "brief.md"
            if (-not (Test-Path -LiteralPath $brief)) { throw "no brief at $brief" }
            "after $($record.brief_attempts) attempt(s)"
          }

      - name: "Check: ticker still the same process"
        timeout-minutes: 1
        run: |
          . .github/windows-smoke/helpers.ps1
          Invoke-Check "ticker survives across steps" {
            if (-not $env:TICKER_PID) { throw "no ticker pid recorded" }
            if (-not (Get-Process -Id $env:TICKER_PID -ErrorAction SilentlyContinue)) { throw "ticker process $env:TICKER_PID is gone" }
            $s = Invoke-Checked $env:HP_EXE @("ticker", "status")
            if ($s -notmatch "pid:\s+$env:TICKER_PID\b") { throw "another ticker runs now: $s" }
            "pid $env:TICKER_PID"
          }

      - name: "Check: command shim, skill junction, CLAUDE.md pointer"
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          Invoke-Check "herdr-projects.cmd shim" {
            $shim = "$env:USERPROFILE\.local\bin\herdr-projects.cmd"
            if (-not (Test-Path -LiteralPath $shim)) { throw "no $shim" }
            $text = (Get-Content -Raw -LiteralPath $shim).TrimEnd()
            $expected = "@`"$env:HP_EXE`" %*"
            if ($text -ne $expected) { throw "shim is '$text', expected '$expected'" }
            $version = Invoke-Checked cmd @("/d", "/c", "herdr-projects", "--version")
            if ($version -notmatch "herdr-projects \d") { throw "shim ran: $version" }
            $version
          }
          Invoke-Check "skill junction" {
            $link = "$env:USERPROFILE\.claude\skills\autoproject"
            $item = Get-Item -LiteralPath $link -Force
            if ($item.LinkType -ne "Junction") { throw "$link is $($item.LinkType), not a junction" }
            $target = [string]$item.Target
            if ($target -ne "$env:GITHUB_WORKSPACE\skill\autoproject") { throw "junction points to $target" }
            if (-not (Test-Path -LiteralPath "$link\SKILL.md")) { throw "SKILL.md not readable through the junction" }
            "-> $target"
          }
          Invoke-Check "CLAUDE.md pointer" {
            $claude = "$env:HERDR_PROJECTS_ROOT\smoke\CLAUDE.md"
            $item = Get-Item -LiteralPath $claude -Force
            if ($item.LinkType) { throw "CLAUDE.md is a $($item.LinkType), expected a plain file" }
            $text = Get-Content -Raw -LiteralPath $claude
            if ($text -ne "@AGENTS.md`n") { throw "CLAUDE.md holds '$text'" }
            "@AGENTS.md"
          }

      - name: "Check: hook command and progress report"
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          $pane = $env:THREAD_PANE
          $log = Get-StubLog $pane
          Write-Host $log
          # The stub runs the configured command as Claude Code does on
          # Windows: in Git Bash when it is installed (it is on the runner).
          Invoke-Check "SessionStart hook" {
            $line = ($log -split "`n") | Where-Object { $_ -match "hook \(\w+\) SessionStart" } | Select-Object -First 1
            if (-not $line) { throw "the stub never ran the SessionStart hook" }
            if ($line -notmatch "exit=Some\(0\)" -or $line -notmatch "report --percent") { throw $line }
            ($line -split "stdout=")[0]
          }
          Invoke-Check "UserPromptSubmit hook" {
            $line = ($log -split "`n") | Where-Object { $_ -match "hook \(\w+\) UserPromptSubmit" } | Select-Object -First 1
            if (-not $line) { throw "the stub never ran the UserPromptSubmit hook" }
            if ($line -notmatch "exit=Some\(0\)" -or $line -notmatch "Before task tools") { throw $line }
            "answered"
          }
          Invoke-Check "report through the shim" {
            $line = ($log -split "`n") | Where-Object { $_ -match "report via shim" } | Select-Object -First 1
            if ($line -notmatch "exit=Some\(0\)") { throw "$line" }
            # Records are keyed by session socket, which `progress` reads
            # from HERDR_SOCKET_PATH, set only inside a pane.
            $env:HERDR_SOCKET_PATH = (Get-Content -Raw "$env:HERDR_PROJECTS_ROOT\smoke\.state\coordinator.json" | ConvertFrom-Json).socket
            $progress = Invoke-Checked $env:HP_EXE @("progress", "--pane", $pane)
            Remove-Item Env:HERDR_SOCKET_PATH
            if ($progress -notmatch "Stub working") { throw "progress record: $progress" }
            "recorded"
          }

      - name: "Check: routines without a shell and with pwsh"
        timeout-minutes: 5
        run: |
          . .github/windows-smoke/helpers.ps1
          $dir = "$env:HERDR_PROJECTS_ROOT\smoke\routines"
          # No shell: the default on Windows. A bare command name found
          # through PATH and PATHEXT (the .cmd shim).
          @(
            '+++',
            'schedule = "every 1m"',
            "command = 'herdr-projects --version'",
            '+++',
            'Smoke routine without a shell.'
          ) -join "`n" | Set-Content -NoNewline -Encoding utf8 "$dir\smoke-none.md"
          @(
            '+++',
            'schedule = "every 1m"',
            'shell = "pwsh"',
            "command = 'Write-Output (""SMOKE-PWSH-"" + (40 + 2))'",
            '+++',
            'Smoke routine with pwsh.'
          ) -join "`n" | Set-Content -NoNewline -Encoding utf8 "$dir\smoke-pwsh.md"

          # `safety set` and `routine approve` refuse without a terminal, so
          # they are typed into a herdr pane, as a person would.
          $term = $env:TERMINAL_PANE
          Invoke-Check "routine approval in a terminal" {
            Send-PaneLine $term "$env:HP_EXE safety set --global routine_commands on"
            Wait-Until "the y/N question" 30 { (Read-Pane $term) -match "\[y/N\]" } | Out-Null
            Send-PaneLine $term "y"
            Wait-Until "routine_commands on" 30 { (Read-Pane $term) -match "routine_commands = on" } | Out-Null
            foreach ($name in @("smoke-none", "smoke-pwsh")) {
              $before = ([regex]::Matches((Read-Pane $term), "Type the routine's name")).Count
              Send-PaneLine $term "$env:HP_EXE routine approve smoke $name"
              Wait-Until "the approve question for $name" 30 { ([regex]::Matches((Read-Pane $term), "Type the routine's name")).Count -gt $before } | Out-Null
              Send-PaneLine $term $name
              Wait-Until "$name approved" 30 { (Read-Pane $term) -match "approved ``$name``" } | Out-Null
            }
            $list = Invoke-Checked $env:HP_EXE @("routine", "list", "smoke")
            if (([regex]::Matches($list, "command: approved")).Count -lt 2) { throw "routine list: $list" }
            "both approved"
          }
          # The ticker runs a due routine on its 15 s tick; the first run of an
          # `every 1m` routine is one minute after the ticker first sees it, so
          # this wait is the one that exceeds a minute. Both routines fall due
          # on the same tick.
          $inbox = "$env:HERDR_PROJECTS_ROOT\smoke\inbox"
          function Find-Item([string] $Pattern) {
            Get-ChildItem -LiteralPath $inbox -Filter *.md -ErrorAction SilentlyContinue |
              Where-Object { (Get-Content -Raw -LiteralPath $_.FullName) -match $Pattern } | Select-Object -First 1
          }
          Invoke-Check "routine with no shell" {
            $item = Wait-Until "an inbox item with the version" 100 { Find-Item "herdr-projects \d+\.\d+" } -IntervalMs 5000
            Get-Content -Raw -LiteralPath $item.FullName | Write-Host
            $item.Name
          }
          Invoke-Check "routine with shell = pwsh" {
            $item = Wait-Until "an inbox item with SMOKE-PWSH-42" 30 { Find-Item "SMOKE-PWSH-42" } -IntervalMs 5000
            Get-Content -Raw -LiteralPath $item.FullName | Write-Host
            $item.Name
          }

      - name: "Check: doctor"
        timeout-minutes: 2
        run: |
          . .github/windows-smoke/helpers.ps1
          Invoke-Check "doctor" {
            $out = Invoke-Quiet $env:HP_EXE @("doctor")
            Write-Host $out.Text
            if ($out.Code -ne 0) { throw "doctor exited $($out.Code): $((($out.Text -split "`n") | Where-Object { $_ -match 'FAIL|fail|✗|missing' }) -join '; ')" }
            "healthy"
          }

      - name: tmate debug session
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.tmate }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Collect logs and state
        if: ${{ always() }}
        run: |
          . .github/windows-smoke/helpers.ps1
          $ErrorActionPreference = "Continue"
          $out = $env:SMOKE_ARTIFACTS
          New-Item -ItemType Directory -Force $out | Out-Null
          function Save([string] $Name, [string[]] $Arguments) {
            (Invoke-Quiet $Arguments[0] $Arguments[1..($Arguments.Length - 1)]).Text | Set-Content -Encoding utf8 (Join-Path $out $Name)
          }
          Save "herdr-version.txt" @("herdr", "--version")
          Save "herdr-plugin-list.json" @("herdr", "plugin", "list", "--json")
          Save "herdr-plugin-logs.txt" @("herdr", "plugin", "logs", "--plugin", "herdr-projects", "--limit", "200")
          Save "herdr-agent-list.json" @("herdr", "agent", "list")
          Save "herdr-pane-list.json" @("herdr", "pane", "list")
          Save "ticker-status.txt" @($env:HP_EXE, "ticker", "status")
          Save "doctor.txt" @($env:HP_EXE, "doctor")
          Save "thread-list.json" @($env:HP_EXE, "thread", "list", "smoke", "--json")
          $panes = ((Invoke-Quiet herdr @("pane", "list")).Text | ConvertFrom-Json).result.panes
          foreach ($pane in $panes) {
            Save "pane-$($pane.pane_id -replace ':', '-').txt" @("herdr", "pane", "read", $pane.pane_id, "--source", "recent-unwrapped", "--lines", "200", "--format", "text")
          }
          foreach ($pair in @(
              @("$env:APPDATA\herdr", "herdr-config"),
              @("$env:APPDATA\herdr-projects", "herdr-projects-config"),
              @($env:HERDR_PROJECTS_ROOT, "projects-root"),
              @($env:STUB_LOG_DIR, "stub-logs"),
              @("$env:USERPROFILE\.claude", "claude-config"))) {
            if (Test-Path -LiteralPath $pair[0]) {
              # Robocopy copies what it can read and skips junction loops.
              robocopy $pair[0] (Join-Path $out $pair[1]) /E /XJ /R:0 /W:0 /NFL /NDL /NJH /NJS | Out-Null
            }
          }
          $tickerLog = Join-Path $env:HERDR_PROJECTS_ROOT ".ticker.log"
          if (Test-Path -LiteralPath $tickerLog) {
            Write-Host "--- last 60 lines of .ticker.log"
            Get-Content -LiteralPath $tickerLog -Tail 60 | ForEach-Object { Write-Host $_ }
          }
          $global:LASTEXITCODE = 0

      - name: Upload logs and state
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: warn
          # .state/ and .ticker.log are dotfiles.
          include-hidden-files: true

      - name: Stop the server and the ticker
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = "Continue"
          & $env:HP_EXE ticker stop 2>&1 | Write-Host
          & herdr server stop 2>&1 | Write-Host
          foreach ($id in @($env:HERDR_SERVER_PID, $env:TICKER_PID)) {
            if ($id -and (Get-Process -Id $id -ErrorAction SilentlyContinue)) {
              & taskkill.exe /PID $id /T /F 2>&1 | Write-Host
            }
          }
          $global:LASTEXITCODE = 0
