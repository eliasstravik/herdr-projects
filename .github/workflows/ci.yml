# Runs the whole check (`npm run check -- --all`: build, made tables, the repo's rules, every test) on every push and
# pull request, on Linux; and on macOS the check of the areas whose tests differ there: a plan writer's read-only mount,
# made with `sandbox-exec` (plan_sandbox, its real_programs_ test refuses a write into the guarded folders for real;
# plan_steps, macOS's own words when it cannot be made), a process's state read with `ps` (detached_jobs), locks taken
# with the kernel's flock, macOS having no `flock` command (home_folder_more), `wc`'s padded count (finish_commit), a temp
# folder whose path is a link (warm_start: /var is /private/var) and a copied program signed again (take_over_more).
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      - name: The check
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: npm run check -- --all

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Probe
        run: |
          sw_vers; uname -m; file /bin/bash; lipo -info /bin/bash || true
          d=$(mktemp -d); cp /bin/bash $d/herdr-superwork; $d/herdr-superwork -c 'echo plain-copy'; echo "plain rc=$?"
          codesign -s - -f $d/herdr-superwork; $d/herdr-superwork -c 'echo resigned'; echo "resigned rc=$?"
          codesign -dv $d/herdr-superwork 2>&1 || true
          cp /bin/bash $d/b3; lipo $d/b3 -thin arm64e -output $d/b4 2>&1; codesign -s - -f $d/b4; $d/b4 -c 'echo thin'; echo "thin rc=$?"
          cp /bin/sleep $d/s2; codesign -s - -f $d/s2; $d/s2 0; echo "sleep rc=$?"
          ls /opt/homebrew/bin | head -50; which perl python3 cc
          printf 'int main(){char b[8];return read(0,b,8)<0;}' > $d/w.c; cc -w -o $d/herdr-w $d/w.c && echo | $d/herdr-w; echo "cc rc=$?"

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-${{ runner.os }}-

      - name: The areas that differ on macOS
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: npm run check -- --all
